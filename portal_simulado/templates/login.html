{% extends "base.html" %}
{% block contenido %}
<div class="tarjeta" style="max-width:420px;margin:40px auto;">
  <h1>Iniciar sesión</h1>
  <p class="nota">Acceso para establecimientos y sus representantes.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/entrar">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario" autocomplete="username" required>
    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" name="contrasena" autocomplete="current-password" required>
    <p style="margin-top:18px"><button type="submit" id="btn-entrar">Entrar</button></p>
  </form>
</div>
{% endblock %}
